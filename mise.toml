[tools]
rust = { version = "stable", components = "rust-analyzer" }
zig = "latest"
"cargo:cargo-zigbuild" = "latest"
"cargo:wasm-pack" = "latest"
node = "latest"
"cargo:cargo-llvm-cov" = "latest"

[env]
RUSTUP_TOOLCHAIN = "{% if os() == 'windows' %}stable-x86_64-pc-windows-msvc{% endif %}"
CARGO_BUILD_TARGET = "{% if os() == 'windows' %}x86_64-pc-windows-msvc{% endif %}"

[tasks]
build = { run = "cargo-zigbuild build" }
run = { run = "cargo-zigbuild run" }
test = { run = "cargo-zigbuild test" }
