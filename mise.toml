[tools]
rust = { version = "stable", components = "rust-analyzer" }
zig = "latest"
"cargo:cargo-zigbuild" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-deny" = "0.20.2"
"cargo:wasm-pack" = "latest"
node = "latest"

[tasks]
cov = { run = "cargo-zigbuild llvm-cov" }
test = { run = "cargo-zigbuild test" }
bench = { run = "cargo-zigbuild bench" }

[tasks.hooks]
run = [
  "git config core.hooksPath .githooks",
  "chmod +x .githooks/pre-commit .githooks/pre-push .githooks/ci-local.sh",
]
description = "Install the git hooks in this repository"

[tasks.licenses]
run = "cargo deny check licenses"
description = "Check the licence of every locked dependency"

[tasks.advisories]
run = "cargo deny check advisories"
description = "Check for known vulnerabilities and yanked releases"

[tasks.bans]
run = "cargo deny check bans"
description = "Check for wildcard dependencies and duplicate versions"

[tasks.deps]
depends = ["licenses", "advisories", "bans"]
description = "Run every cargo-deny check"

[tasks.check]
depends = ["test", "deps"]
description = "Run the local checks that CI also runs"
