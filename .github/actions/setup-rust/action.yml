# The Rust toolchain and the cargo CLIs that the CI jobs need.
#
# The runner image already ships Rust, Cargo and rustup. This action adds the
# components and the CLIs that the image does not have. Each CLI comes from
# crates.io with `cargo install --locked` and a pinned version. An unpinned
# install is a different tool after a new release.
#
# This is a composite action, not a reusable workflow. The audit trail for
# "what does this run" stays in this file.

name: Setup Rust
description: >-
  Add the toolchain components that a job needs, cache the cargo home and the
  target directory, and install the cargo CLIs that a job uses.

inputs:
  toolchain:
    description: Toolchain version to install, or empty to use the runner image.
    required: false
    default: ""
  components:
    description: Comma-separated rustup components to add.
    required: false
    default: "rustfmt,clippy"
  install:
    description: Comma-separated cargo CLIs to install, as name or name@version.
    required: false
    default: ""
  cache-suffix:
    description: Extra text for the target cache key.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The registry and the git checkouts are keyed on Cargo.lock. They survive a
    # source change. The build directory is cached separately below.
    - name: Cache the cargo registry and git checkouts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-

    - name: Install the toolchain
      if: inputs.toolchain != ''
      shell: bash
      run: |
        set -euo pipefail
        # --profile minimal skips the docs and the extra targets. The job needs
        # only the compiler.
        rustup toolchain install "${{ inputs.toolchain }}" --profile minimal --no-self-update
        rustup override set "${{ inputs.toolchain }}"

    - name: Add the components
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        IFS=',' read -ra wanted <<< "$COMPONENTS"
        for component in "${wanted[@]}"; do
          [ -n "$component" ] || continue
          rustup component add "$component"
        done
        rustc --version
        cargo --version

    - name: Cache the build directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: target
        # The toolchain is part of the key. A target directory from one compiler
        # is not reusable by another compiler. `image` is the toolchain that the
        # runner image ships.
        key: >-
          target-${{ runner.os }}-${{ inputs.toolchain || 'image' }}-${{ hashFiles('**/Cargo.lock') }}-${{ inputs.cache-suffix }}
        restore-keys: |
          target-${{ runner.os }}-${{ inputs.toolchain || 'image' }}-${{ inputs.cache-suffix }}-

    - name: Install the cargo CLIs
      if: inputs.install != ''
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: |
        set -euo pipefail
        IFS=',' read -ra tools <<< "$INSTALL"
        for tool in "${tools[@]}"; do
          [ -n "$tool" ] || continue
          # --locked uses the dependency graph that the CLI's Cargo.lock pins.
          echo "installing $tool"
          cargo install "$tool" --locked
        done

    - name: Report the installed versions
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "toolchain: $(rustc --version)"
        rustup component list --installed || true
        for tool in cargo-deny cargo-llvm-cov wasm-pack; do
          if command -v "$tool" > /dev/null; then
            echo "$tool: $("$tool" --version 2>/dev/null || echo present)"
          fi
        done
