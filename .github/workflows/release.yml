name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # The order follows the dependency graph. Each crate appears after every
  # workspace crate that it depends on.
  RELEASE_CRATES: >-
    oxkv
    oxkv-cached
    oxkv-contracts
    oxkv-consumer
    oxkv-cost
    oxkv-event
    oxkv-enforce
    oxkv-falsify
    oxkv-freeze
    oxkv-hooks
    oxkv-hydrate
    oxkv-index
    oxkv-key
    oxkv-kv
    oxkv-manifest
    oxkv-map
    oxkv-opfs
    oxkv-ops
    oxkv-otel
    oxkv-outbox
    oxkv-policy
    oxkv-portable
    oxkv-projection
    oxkv-qualify
    oxkv-query
    oxkv-readpin
    oxkv-repl
    oxkv-replica
    oxkv-rpc
    oxkv-rule
    oxkv-s3
    oxkv-scheduler
    oxkv-scope
    oxkv-search
    oxkv-security
    oxkv-snapshot
    oxkv-tier
    oxkv-wasm
    oxkv-wire
    oxkv-write

jobs:
  checks:
    name: Lint & Test
    # Gate: both publish jobs wait for fmt/clippy/test and wasm tests.
    uses: ./.github/workflows/ci.yml

  verify-publish:
    name: Verify packaging (dry-run)
    # Dry-run gate: both registries must verify clean before either
    # real publish runs. If anything fails here, nothing goes live.
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: ''
      - name: Verify crate packaging
        run: |
          set -euo pipefail
          read -r -a crates <<< "$RELEASE_CRATES"

          # A tag release publishes a version that crates.io does not have
          # yet. A dependent crate cannot resolve that version from the
          # registry during `cargo publish --dry-run`. Patch the registry to
          # the local workspace paths so the gate checks the package contents
          # and the build for every crate. The real publish uses the registry.
          patch="$RUNNER_TEMP/oxkv-workspace-patch.toml"
          {
            echo '[patch.crates-io]'
            for crate in "${crates[@]}"; do
              if [ "$crate" = "oxkv" ]; then
                echo "oxkv = { path = \"$GITHUB_WORKSPACE\" }"
              else
                echo "$crate = { path = \"$GITHUB_WORKSPACE/crates/$crate\" }"
              fi
            done
          } > "$patch"

          # Guard: the list must cover every workspace crate. A new crate must
          # join this list before the release can pass the gate.
          expected="$(printf '%s\n' "${crates[@]}" | sort)"
          actual="$(cargo tree --workspace --depth 0 --prefix none \
            | awk 'NF { print $1 }' \
            | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "error: the crate list does not match the workspace." >&2
            printf 'crate list:\n%s\nworkspace:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

          for crate in "${crates[@]}"; do
            echo "::group::cargo publish --dry-run -p $crate"
            cargo publish --dry-run -p "$crate" --config "$patch"
            echo "::endgroup::"
          done
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack if missing
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Verify npm packaging
        working-directory: crates/oxkv-wasm
        run: |
          rm -rf pkg && wasm-pack build --target web --release --out-dir pkg --out-name oxkv
          # wasm-pack derives the npm package name from the Cargo crate
          # (`oxkv-wasm`). The release publishes the existing `oxkv` package,
          # so set the generated name again before any publish.
          (cd pkg && npm pkg set \
            name=oxkv \
            repository.type=git \
            repository.url=git+https://github.com/azamaulanaaa/oxkv.git)
          # Guard: a crate or workflow change must not silently create a new
          # npm package. The publish job uses the same name.
          name="$(node -p "require('./pkg/package.json').name")"
          if [ "$name" != "oxkv" ]; then
            echo "error: pkg/package.json has name '$name', expected 'oxkv'." >&2
            exit 1
          fi
          npm publish ./pkg --dry-run

  publish-crate:
    name: Publish to crates.io
    needs: [checks, verify-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: ''
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # The order follows the dependency graph. A crate is published only
          # after every workspace crate that it depends on is on the index.
          read -r -a crates <<< "$RELEASE_CRATES"
          last="${crates[${#crates[@]}-1]}"
          for crate in "${crates[@]}"; do
            pkgid="$(cargo pkgid -p "$crate")"
            version="${pkgid##*#}"
            version="${version##*@}"
            if [ -z "$version" ]; then
              echo "error: cannot read the version of $crate." >&2
              exit 1
            fi

            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate"
            echo "::endgroup::"

            if [ "$crate" = "$last" ]; then
              break
            fi

            # The next crate resolves crates.io, not the workspace path. Wait
            # until the index lists the version that this job published.
            echo "waiting for $crate $version on the crates.io index"
            for attempt in $(seq 1 60); do
              if cargo info "$crate@$version" --registry crates-io >/dev/null 2>&1; then
                echo "$crate $version is available on the crates.io index"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "error: $crate $version is absent from the crates.io index after 5 minutes." >&2
                exit 1
              fi
              sleep 5
            done
          done

  publish-npm:
    name: Publish WASM to npm
    # Gated on the dry-run verification only — runs alongside publish-crate.
    needs: [checks, verify-publish]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: ''
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack if missing
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) requires npm >= 11.5.0; node 24 usually
      # ships a compatible npm, but pin-latest removes any doubt.
      # NOTE: this is not optional long-term - GitHub deprecated
      # 2FA-bypass granular tokens for direct publishing (~Jan 2027,
      # github.blog 2026-07-08), making OIDC the only automated path.
      - name: Install recent npm
        run: npm install -g npm@latest
      - name: Build npm package
        working-directory: crates/oxkv-wasm
        run: |
          rm -rf pkg && wasm-pack build --target web --release --out-dir pkg --out-name oxkv
          # Use the existing `oxkv` npm package, not the crate name that
          # wasm-pack puts in pkg/package.json.
          (cd pkg && npm pkg set \
            name=oxkv \
            repository.type=git \
            repository.url=git+https://github.com/azamaulanaaa/oxkv.git)
      - name: Publish to npm
        run: npm publish ./pkg --provenance
        working-directory: crates/oxkv-wasm
