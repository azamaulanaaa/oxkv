name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    container:
      image: rust:1
    env:
      CARGO_HOME: /usr/local/cargo
    steps:
      - uses: actions/checkout@v7
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish WASM to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    container:
      image: rust:1
    env:
      CARGO_HOME: /usr/local/cargo
    steps:
      - uses: actions/checkout@v7
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/bin/
            ${{ env.CARGO_HOME }}/registry/index/
            ${{ env.CARGO_HOME }}/registry/cache/
            ${{ env.CARGO_HOME }}/git/db/
            target/
          key: ${{ runner.os }}-release-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-wasm-cargo-
      - name: Install wasm-pack if missing
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: rm -rf pkg && wasm-pack build --target web --release --out-dir pkg
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd pkg && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Publish to npm
        run: npm publish ./pkg
