name: CI

# These jobs only read the checkout and publish artifacts. A called workflow
# inherits the token of its caller, so this line keeps the token read-only when
# release.yml calls this workflow.
permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  # Re-check advisories against new advisory data every week.
  schedule:
    - cron: '0 4 * * 1'

env:
  CARGO_TERM_COLOR: always

# A newer run on the same ref replaces an older run. A tag run must finish, so
# it gets its own group that nothing cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native:
    name: Test & Lint (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test (--all-features)
        run: cargo test --workspace --all-features --locked
      - name: Doctests
        # `--all-targets` does not run doctests. This step runs them.
        run: cargo test --workspace --doc --all-features --locked
      - name: Check docs
        # README ships as crate docs: intra-doc links (e.g. feature-gated
        # items) resolve only when every feature exists — docs.rs does the same.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked

  wasm:
    name: Test (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack if missing
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Test core wasm (Node)
        # The core covers its cache and LSM wasm tests.
        run: wasm-pack test --node
      - name: Test OPFS wasm (Node)
        # The OPFS crate covers browser storage. Node has no window, so these
        # tests announce a skip here. The browser job runs them for real.
        run: wasm-pack test --node
        working-directory: crates/oxkv-opfs
      - name: Test wasm bindings (Node)
        # The binding crate covers the JavaScript wrappers.
        run: wasm-pack test --node
        working-directory: crates/oxkv-wasm
      - name: Check wasm32 build with all features
        run: cargo check -p oxkv -p oxkv-opfs -p oxkv-wasm --target wasm32-unknown-unknown --all-features --locked
      - name: Clippy (wasm32)
        # Lints inside wasm-only code (timer bridges, OPFS backend, bindings)
        # are invisible to the native job.
        run: cargo clippy -p oxkv -p oxkv-opfs -p oxkv-wasm --target wasm32-unknown-unknown --all-features --locked -- -D warnings

  wasm-browser:
    name: Test (wasm32 headless ${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Skip the weekly scheduled run. A browser test does not check advisories.
    if: github.event_name != 'schedule'
    # This job is the one exception. It needs Debian's Chromium and Firefox
    # packages. It runs in the rust:1 container. It does not set CARGO_HOME, so
    # the image's default applies.
    container:
      image: rust:1
    strategy:
      # One browser failure must not hide the other browser result.
      fail-fast: false
      matrix:
        include:
          - browser: Chrome
            wasm_args: --chrome
          - browser: Firefox
            wasm_args: --firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/
          key: ${{ runner.os }}-wasm-browser-${{ matrix.browser }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-browser-${{ matrix.browser }}-cargo-
      - name: Install wasm-pack if missing
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install Chromium and its matching driver
        if: matrix.browser == 'Chrome'
        # Install both packages from the same Debian repository so the
        # chromedriver version matches the installed Chromium.
        run: |
          apt-get update -qq
          apt-get install -y -qq chromium chromium-driver
      - name: Install Firefox and geckodriver
        if: matrix.browser == 'Firefox'
        # Install both packages from the same Debian repository so the
        # geckodriver version matches the installed Firefox.
        run: |
          apt-get update -qq
          apt-get install -y -qq firefox-esr geckodriver
      - name: Print browser and driver versions
        run: |
          if [ "${{ matrix.browser }}" = "Chrome" ]; then
            chromium --version
            chromedriver --version
          else
            firefox-esr --version
            geckodriver --version
          fi
      - name: Select the browser environment
        run: |
          if [ "${{ matrix.browser }}" = "Chrome" ]; then
            echo "CHROME_BIN=/usr/bin/chromium" >> "$GITHUB_ENV"
            echo "CHROMEDRIVER=/usr/bin/chromedriver" >> "$GITHUB_ENV"
          else
            echo "FIREFOX_BIN=/usr/bin/firefox-esr" >> "$GITHUB_ENV"
            echo "GECKODRIVER=/usr/bin/geckodriver" >> "$GITHUB_ENV"
            echo "MOZ_HEADLESS=1" >> "$GITHUB_ENV"
          fi
      - name: Test core wasm (headless ${{ matrix.browser }})
        # The core covers its cache and LSM wasm tests.
        run: wasm-pack test --headless ${{ matrix.wasm_args }}
      - name: Test OPFS wasm (headless ${{ matrix.browser }})
        # Real browser execution: the OPFS persistence and Web Lock tests
        # need a real browser, so only this step proves them.
        run: wasm-pack test --headless ${{ matrix.wasm_args }}
        working-directory: crates/oxkv-opfs
      - name: Test wasm bindings (headless ${{ matrix.browser }})
        # The binding crate covers the JavaScript wrappers.
        run: wasm-pack test --headless ${{ matrix.wasm_args }}
        working-directory: crates/oxkv-wasm

  qualification:
    name: Qualification release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Run the qualification suite
        # The release workflow calls this workflow. A failure here blocks the
        # tag. The suite runs the release_candidate tier offline.
        run: cargo run -p oxkv-qualify --locked -- --tier release_candidate

  # One job per cargo-deny check. A failure names the check that failed:
  # a licence problem and a vulnerability are different conversations.
  licenses:
    name: Licences (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: ''
          install: cargo-deny@0.20.2
      - name: Check dependency licences
        run: cargo deny check licenses

  advisories:
    name: Advisories (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: ''
          install: cargo-deny@0.20.2
      - name: Check advisories (vulnerabilities and yanked releases)
        run: cargo deny check advisories

  bans:
    name: Bans (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: ''
          install: cargo-deny@0.20.2
      - name: Check wildcards and duplicate versions
        run: cargo deny check bans

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          install: cargo-llvm-cov@0.9.1
          cache-suffix: coverage
      - name: Measure coverage
        run: cargo llvm-cov --all-features --locked --html --output-dir target/llvm-cov
      - name: Upload report
        # A failed upload does not fail the job. The measurement is the gate.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 7

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the release workflow gate
        # This check makes GitHub enforce that release.yml still calls ci.yml
        # and that the publish jobs still need `checks`.
        run: .githooks/ci-local.sh release-config
      - name: Check the release gates
        # The release gate must include the browser tier and the qualification
        # matrix. The qualification workflow must run the freeze and vector
        # gates.
        run: .github/scripts/check-release-gates.sh
