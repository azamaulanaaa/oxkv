[package]
name = "oxkv-ops"
version = "0.12.0"
edition = "2024"
description = "Portable operations contracts for oxkv: migration, backup, restore, quota, rate limits, compaction, and telemetry records."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "../../README.md"
keywords = ["operations", "backup", "migration", "keyvalue", "database"]
categories = ["database"]

[dependencies]
blake3 = "1.8"
oxkv-contracts = { path = "../oxkv-contracts", version = "0.12.0" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
