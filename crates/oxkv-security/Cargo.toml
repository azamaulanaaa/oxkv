[package]
name = "oxkv-security"
version = "0.12.0"
edition = "2024"
description = "Portable authentication, authorization, audit, and access-log boundary for oxkv."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "../../README.md"
keywords = ["security", "audit", "authentication", "keyvalue"]
categories = ["database"]

[dependencies]
blake3 = "1.8"
oxkv-contracts = { path = "../oxkv-contracts", version = "0.12.0" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
