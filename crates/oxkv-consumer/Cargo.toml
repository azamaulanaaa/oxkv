[package]
name = "oxkv-consumer"
version = "0.12.0"
edition = "2024"
description = "Reference effect consumer for oxkv: per-key cursors, idempotent effects, retries, and a dead-letter queue."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "../../README.md"
keywords = ["consumer", "keyvalue", "idempotency", "dead-letter"]
categories = ["database"]

[dependencies]
oxkv-contracts = { path = "../oxkv-contracts", version = "0.12.0" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
