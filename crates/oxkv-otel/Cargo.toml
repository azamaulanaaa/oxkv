[package]
name = "oxkv-otel"
version = "0.12.1"
publish = false
edition = "2024"
description = "OpenTelemetry decorator for the oxkv key-value store."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "../../README.md"
keywords = ["opentelemetry", "keyvalue", "kv-store", "database"]
categories = ["database"]

[dependencies]
oxkv = { path = "../..", version = "0.12.1", default-features = false }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
opentelemetry = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
] }

[dev-dependencies]
oxkv = { path = "../..", version = "0.12.1", features = ["btree"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
  "testing",
] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt"] }

[lints]
workspace = true
