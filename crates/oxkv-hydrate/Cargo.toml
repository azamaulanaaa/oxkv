[package]
name = "oxkv-hydrate"
version = "0.12.1"
publish = false
edition = "2024"
description = "Resumable, verified snapshot hydration and crash recovery for an oxkv replica."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "../../README.md"
keywords = ["snapshot", "hydration", "replica", "crash-recovery", "keyvalue"]
categories = ["database"]

[dependencies]
blake3 = "1"
oxkv-contracts = { path = "../oxkv-contracts", version = "0.12.1" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
