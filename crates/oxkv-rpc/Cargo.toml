[package]
name = "oxkv-rpc"
version = "0.12.0"
publish = false
edition = "2024"
description = "Generated RPC surface for oxkv: neutral descriptor, Connect envelope, and sans-IO reference transport."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "README.md"
keywords = ["rpc", "descriptor", "connect", "keyvalue"]
categories = ["database"]

[dependencies]
blake3 = "1.8"
oxkv-contracts = { path = "../oxkv-contracts", version = "0.12.0" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
