[package]
name = "oxkv-s3"
version = "0.12.0"
publish = false
edition = "2024"
description = "object_store adapter for the oxkv key-value store."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "../../README.md"
keywords = ["s3", "gcs", "azure", "keyvalue"]
categories = ["database"]

[dependencies]
oxkv = { path = "../..", version = "0.12.0", default-features = false }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
object_store = { version = "0.12", features = ["aws", "gcp", "azure"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt"] }

[lints]
workspace = true
