[package]
name = "oxkv-readpin"
version = "0.12.0"
edition = "2024"
description = "Pins, session minimums, bounded-staleness reads, and read-your-writes for oxkv replicas."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "../../README.md"
keywords = ["read", "replica", "staleness", "consistency", "database"]
