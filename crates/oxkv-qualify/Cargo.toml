[package]
name = "oxkv-qualify"
version = "0.12.0"
edition = "2024"
description = "Portable qualification suite for oxkv: scenario matrix, fault injection, golden vectors, differential comparison, and fuzz entry points."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
readme = "../../README.md"
keywords = ["qualification", "contract", "golden-vector", "fuzz", "wasm"]
categories = ["database", "development-tools::testing"]

[dependencies]
blake3 = "1.8"
oxkv-contracts = { path = "../oxkv-contracts", version = "0.12.0" }
oxkv-index = { path = "../oxkv-index", version = "0.12.0" }
serde_json = "1"

[dev-dependencies]
oxkv-freeze = { path = "../oxkv-freeze", version = "0.12.0" }

[lints]
workspace = true
