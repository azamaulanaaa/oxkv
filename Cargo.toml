[package]
name = "rust-template"
version = "0.1.0"
edition = "2024"
description = "A minimal Rust WASM library template with strict linting."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/rust-template" 
keywords = ["wasm", "webassembly", "template"]
categories = ["wasm", "development-tools"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:wasm-bindgen-test"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true } 
console_error_panic_hook = { version = "0.1", optional = true}
wasm-bindgen-test = { version = "0.3", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"
