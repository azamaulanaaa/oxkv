[workspace]
members = [
  "crates/oxkv-contracts",
  "crates/oxkv-freeze",
  "crates/oxkv-falsify",
  "crates/oxkv-qualify",
  "crates/oxkv-security",
  "crates/oxkv-consumer",
  "crates/oxkv-rpc",
  "crates/oxkv-event",
  "crates/oxkv-readpin",
  "crates/oxkv-map",
  "crates/oxkv-repl",
  "crates/oxkv-cost",
  "crates/oxkv-index",
  "crates/oxkv-projection",
  "crates/oxkv-hydrate",
  "crates/oxkv-replica",
  "crates/oxkv-wire",
  "crates/oxkv-scope",
  "crates/oxkv-enforce",
  "crates/oxkv-scheduler",
  "crates/oxkv-outbox",
  "crates/oxkv-policy",
  "crates/oxkv-manifest",
  "crates/oxkv-snapshot",
  "crates/oxkv-key",
  "crates/oxkv-tier",
  "crates/oxkv-hooks",
  "crates/oxkv-kv",
  "crates/oxkv-portable",
  "crates/oxkv-wasm",
  "crates/oxkv-otel",
  "crates/oxkv-s3",
  "crates/oxkv-query",
  "crates/oxkv-opfs",
  "crates/oxkv-cached",
  "crates/oxkv-write",
  "crates/oxkv-search",
  "crates/oxkv-rule",
  "crates/oxkv-ops",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"

[package]
name = "oxkv"
version = "0.12.1"
edition = "2024"
description = "A transactional key-value store with a durable LSM backend, cursor pagination, and streaming snapshots. Separate crates provide WASM bindings, OpenTelemetry, and object storage."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
keywords = ["wasm", "keyvalue", "kv-store", "transaction", "opentelemetry"]
categories = ["wasm", "database", "data-structures"]
readme = "README.md"

[features]
default = ["oxkv"]
## In-memory B-tree backend (pure Rust, test and bench baseline).
btree = []
## Enables [`OxKvStore`] — portable LSM over `Storage` (native + `wasm32`).
## Each `dep:` below is justified inline where the dependency is declared.
oxkv = ["dep:crc32fast", "dep:sha2", "dep:async-lock", "dep:futures-timer"]
## Optional moka-backed cache (native-only) — alternative to built-in LruCache.
moka = ["dep:moka"]

[dependencies]
async-trait = "0.1"
async-lock = { version = "3", optional = true }
futures-timer = { version = "3", optional = true }
crc32fast = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# A drop-in `std::time` clock that also works on `wasm32-unknown-unknown`.
web-time = "1"

# Native-only deps (not wasm32) — gated here so `cargo check --target wasm32
# --all-features` does not try to build the native-only dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moka = { version = "0.12", optional = true, features = ["future"] }

[[bench]]
name = "kv_bench"
harness = false
required-features = ["btree", "oxkv"]

[[bench]]
name = "cache_bench"
harness = false
required-features = ["oxkv"]

[dev-dependencies]
mockall = "0.15"
# Kept wasm-safe on purpose: `wasm-pack test --node` builds `--tests`, and
# tokio hard-errors on wasm32 when any of fs/io-std/net/process/
# rt-multi-thread/signal is enabled. The engine itself stays
# runtime-agnostic (`futures`/`async-lock` only).
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt"] }

# Criterion pulls in Rayon, which does not compile for wasm32; benches are a
# native-only concern.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"
# Multi-threaded scheduler for the threaded stress tests and benches.
# Native-only: the feature does not compile for wasm32 (see above).
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# futures-timer's setTimeout-backed wheel; without it the native wheel calls
# Instant::now(), which panics on wasm32-unknown-unknown.
futures-timer = { version = "3", optional = true, features = ["wasm-bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The core keeps its LSM wasm tests. The cache tests live in
# `crates/oxkv-cached`, and the browser OPFS tests live in `crates/oxkv-opfs`.
wasm-bindgen-test = "0.3"

[lints]
workspace = true

# Criterion must measure optimized code: the default bench profile is
# unoptimized, which once hid a real O(n^2) behind debug-mode serde costs
# and made every number meaningless for production.
[profile.bench]
inherits = "release"

# docs.rs builds default features only unless told otherwise — that hid
# every feature-gated item. Build all features so the full API (minus
# wasm-only targets) is documented.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
