[package]
name = "oxkv"
version = "0.2.0"
edition = "2024"
description = "A transactional key-value store with WASM bindings, cursor pagination."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaaa/oxkv"
keywords = ["wasm", "keyvalue", "kv-store", "transaction"]
categories = ["wasm", "database", "data-structures"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
## Enables [`OtelStore`], an OpenTelemetry-instrumented decorator that wraps
## any [`Store`] and emits spans and metrics around every operation.
##
## The crate depends only on the OpenTelemetry *API*; applications plug in
## their own SDK providers globally, so exporters stay out of this crate.
otel = ["dep:opentelemetry"]

[dependencies]
opentelemetry = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
], optional = true }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
pest = "2.9.0"
pest_derive = "2.9.0"
redb = "4.2.0"
regex = "1"
serde = "1"
serde_json = "1"
strsim = "0.11"
thiserror = "2"

[[bench]]
name = "kv_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false

[dev-dependencies]
mockall = "0.15"
tokio = { version = "1.53.1", features = ["test-util", "macros"] }

# Criterion pulls in Rayon, which does not compile for wasm32; benches are a
# native-only concern. Same for the OpenTelemetry SDK used by the `otel`
# feature's tests (its rand/getrandom chain needs a wasm-specific backend).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7"
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "trace",
  "metrics",
  "testing",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-streams = "0.6"
web-sys = { version = "0.3", features = ["ReadableStream"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"
